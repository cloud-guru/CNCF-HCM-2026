---
# Test Stargz Lazy Loading with vLLM image
# Image: harbor.example.com/myproject/vllm-openai:v0.12.0-estargz
# Requires: GPU node (lab4), Stargz installed (install-stargz.yml)
#
# Usage: ansible-playbook -i hosts.ini test-stargz-vllm.yml

- name: Cleanup before testing
  hosts: master
  become: yes
  become_user: ubuntu
  vars:
    test_pod_name: "test-stargz-vllm"
  tasks:
    - name: Delete existing test pod
      shell: kubectl delete pod {{ test_pod_name }} --ignore-not-found=true
      changed_when: false

    - name: Wait for pod deletion
      pause:
        seconds: 5

- name: Purge image cache on worker nodes
  hosts: workers
  become: yes
  vars:
    test_image: "harbor.example.com/myproject/vllm-openai:v0.12.0-estargz"
  tasks:
    - name: Cordon worker to prevent pod scheduling during cleanup
      shell: kubectl cordon {{ ansible_hostname }}
      delegate_to: "{{ groups['master'][0] }}"
      become_user: ubuntu
      become: yes

    - name: Remove test image refs from containerd
      shell: |
        ctr -n k8s.io images rm {{ test_image }} 2>/dev/null || true
        ctr -n k8s.io images ls | grep vllm | awk '{print $1}' | xargs -r ctr -n k8s.io images rm 2>/dev/null || true

    - name: Remove all stargz snapshots from containerd metadata
      shell: |
        ctr -n k8s.io snapshots --snapshotter stargz ls 2>/dev/null | tail -n +2 | awk '{print $1}' | while read snap; do
          if [ -n "$snap" ]; then
            ctr -n k8s.io snapshots --snapshotter stargz rm "$snap" 2>/dev/null || true
          fi
        done

    - name: Remove content blobs with stale stargz GC references
      shell: |
        ctr -n k8s.io content ls 2>/dev/null | grep "containerd.io/gc.ref.snapshot.stargz" | awk '{print $1}' | while read digest; do
          if [ -n "$digest" ]; then
            ctr -n k8s.io content rm "$digest" 2>/dev/null || true
          fi
        done

    - name: Stop services before wiping stargz data directories
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - kubelet
        - containerd
        - stargz-snapshotter

    - name: Wipe stargz data directories
      shell: rm -rf /var/lib/containerd-stargz-grpc/snapshots/ /var/lib/containerd-stargz-grpc/blobstore/

    - name: Start stargz snapshotter
      systemd:
        name: stargz-snapshotter
        state: started

    - name: Start containerd
      systemd:
        name: containerd
        state: started

    - name: Start kubelet
      systemd:
        name: kubelet
        state: started

    - name: Wait for stargz socket
      wait_for:
        path: /run/containerd-stargz-grpc/containerd-stargz-grpc.sock
        timeout: 30

    - name: Wait for node to be Ready before uncordon
      shell: kubectl wait node {{ ansible_hostname }} --for=condition=Ready --timeout=120s
      delegate_to: "{{ groups['master'][0] }}"
      become_user: ubuntu
      become: yes

    - name: Uncordon worker
      shell: kubectl uncordon {{ ansible_hostname }}
      delegate_to: "{{ groups['master'][0] }}"
      become_user: ubuntu
      become: yes

- name: Test Stargz lazy loading with vLLM
  hosts: master
  become: yes
  become_user: ubuntu
  vars:
    test_image: "harbor.example.com/myproject/vllm-openai:v0.12.0-estargz"
    image_pull_secret: "harbor-creds"
    test_pod_name: "test-stargz-vllm"
    log_dir: "./stargz-vllm-test-{{ ansible_date_time.epoch }}"
  tasks:
    - name: Verify stargz snapshotter is active on GPU node
      shell: ctr -n k8s.io plugins ls | grep stargz
      delegate_to: "{{ groups['workers'] | select('match', 'lab4') | first }}"
      become: yes
      become_user: root
      register: stargz_check
      failed_when: stargz_check.rc != 0

    - name: Create log directory
      file:
        path: "{{ log_dir }}"
        state: directory
      delegate_to: localhost
      become: no

    - name: Export log_dir for later plays
      set_fact:
        stargz_vllm_log_dir: "{{ log_dir }}"

    - name: Measure pod startup time
      shell: |
        START=$(date +%s.%N)
        kubectl run {{ test_pod_name }} \
          --image={{ test_image }} \
          --overrides='{
            "spec": {
              "nodeName": "worker-4",
              "imagePullSecrets": [{"name": "{{ image_pull_secret }}"}],
              "volumes": [{"name": "models", "persistentVolumeClaim": {"claimName": "llama-models-pvc"}}],
              "containers": [{
                "name": "{{ test_pod_name }}",
                "image": "{{ test_image }}",
                "command": ["vllm", "serve", "/models/meta-llama/Meta-Llama-3-8B", "--host=0.0.0.0", "--port=8000", "--served-model-name", "meta-llama/Meta-Llama-3-8B", "--load-format", "runai_streamer", "--disable-log-requests"],
                "volumeMounts": [{"name": "models", "mountPath": "/models"}],
                "resources": {
                  "limits": {"nvidia.com/gpu": "1"},
                  "requests": {"nvidia.com/gpu": "1"}
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8000
                  },
                  "initialDelaySeconds": 30,
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "successThreshold": 1,
                  "failureThreshold": 60
                }
              }]
            }
          }'

        if kubectl wait --for=condition=Ready pod/{{ test_pod_name }} --timeout=600s; then
          END=$(date +%s.%N)
          DURATION=$(awk "BEGIN {printf \"%.2f\", $END - $START}")
          echo "=== TIMING ==="
          echo "Duration: ${DURATION} seconds"
          echo ""
          echo "=== POD EVENTS ==="
          kubectl describe pod {{ test_pod_name }} | grep -A 20 "Events:"
          exit 0
        else
          echo "Pod failed to start within 600 seconds"
          kubectl describe pod {{ test_pod_name }} | tail -30
          exit 1
        fi
      register: startup_time
      async: 700
      poll: 15
      ignore_errors: yes

    - name: Get node where pod is running
      shell: kubectl get pod {{ test_pod_name }} -o jsonpath='{.spec.nodeName}'
      register: pod_node
      changed_when: false
      ignore_errors: yes

    - name: Save test results
      copy:
        content: |
          ========================================
          Stargz vLLM Test Results
          ========================================
          Timestamp: {{ ansible_date_time.iso8601 }}
          Image: {{ test_image }}
          Pod: {{ test_pod_name }}
          Node: {{ pod_node.stdout | default('N/A') }}

          {{ startup_time.stdout }}

          Status: {{ 'PASSED' if startup_time.rc == 0 else 'FAILED' }}
        dest: "{{ log_dir }}/test-results.log"
      delegate_to: localhost
      become: no

    - name: Display timing results
      debug:
        msg:
          - "========================================"
          - "Stargz vLLM Startup Time"
          - "========================================"
          - "{{ startup_time.stdout_lines }}"
          - "{{ 'PASSED' if startup_time.rc == 0 else 'FAILED' }}"
          - "Logs: {{ log_dir }}/"

- name: Test vLLM inference endpoint
  hosts: master
  become: yes
  become_user: ubuntu
  vars:
    test_pod_name: "test-stargz-vllm"
  tasks:
    - name: Send Hello prompt to vLLM chat endpoint
      shell: |
        START=$(date +%s.%N)
        OUTPUT=$(kubectl exec {{ test_pod_name }} -- curl -s -X POST http://localhost:8000/v1/completions \
          -H "Content-Type: application/json" \
          -d '{"model": "meta-llama/Meta-Llama-3-8B", "prompt": "Hello", "max_tokens": 50}')
        END=$(date +%s.%N)
        DURATION=$(awk "BEGIN {printf \"%.2f\", $END - $START}")
        echo "$OUTPUT"
        echo "Inference time: ${DURATION} seconds"
      register: inference_test
      ignore_errors: yes

    - name: Save inference test to log
      copy:
        content: |
          ========================================
          vLLM Inference Endpoint Test (Stargz)
          ========================================
          {{ inference_test.stdout }}

          Status: {{ 'PASSED' if inference_test.rc == 0 else 'FAILED' }}
        dest: "{{ hostvars[groups['master'][0]]['stargz_vllm_log_dir'] }}/inference-test.log"
      delegate_to: localhost
      become: no

    - name: Display inference test result
      debug:
        msg:
          - "vLLM /v1/models: {{ 'PASSED' if inference_test.rc == 0 else 'FAILED' }}"
          - "{{ inference_test.stdout_lines }}"

- name: Check Stargz cache on workers
  hosts: workers
  become: yes
  vars:
    log_dir: "{{ hostvars[groups['master'][0]]['stargz_vllm_log_dir'] }}"
  tasks:
    - name: Check stargz cache size
      shell: du -sh /var/lib/containerd-stargz-grpc/ 2>/dev/null || echo "N/A"
      register: cache_size
      changed_when: false

    - name: Count active stargz snapshots
      shell: ctr -n k8s.io snapshots --snapshotter stargz ls 2>/dev/null | tail -n +2 | wc -l
      register: snapshot_count
      changed_when: false

    - name: Save worker stats
      blockinfile:
        path: "{{ log_dir }}/worker-cache-stats.log"
        marker: "# {mark} {{ inventory_hostname }}"
        create: yes
        block: |
          Worker: {{ inventory_hostname }}
          Stargz cache: {{ cache_size.stdout }}
          Active snapshots: {{ snapshot_count.stdout }}
      delegate_to: localhost
      become: no

    - name: Display worker status
      debug:
        msg:
          - "{{ inventory_hostname }}: cache={{ cache_size.stdout }}, snapshots={{ snapshot_count.stdout }}"
